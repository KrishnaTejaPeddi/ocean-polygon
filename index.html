<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Low-Poly Ocean</title>
<style>
  :root{
    --bg-top:#0a1a2b;
    --bg-bottom:#04101c;
    --fg:#dceaf5;
    --accent:#7fd8d0;
  }
  html,body{
    height:100%;
    margin:0;
    background:linear-gradient(180deg,var(--bg-top),var(--bg-bottom));
    overflow:hidden;
    font-family:Georgia, 'Times New Roman', serif;
    color:var(--fg);
  }
  #app{position:fixed;inset:0;}
  canvas{display:block;width:100%;height:100%;}
  #hud{
    position:fixed;
    left:0; right:0; top:0;
    padding:calc(28px + env(safe-area-inset-top,0px)) 32px 0;
    pointer-events:none;
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
  }
  #title{
    font-size:22px;
    letter-spacing:0.02em;
    font-style:italic;
    color:var(--fg);
    text-shadow:0 2px 12px rgba(0,0,0,0.5);
  }
  #controls{
    position:fixed;
    right:24px;
    bottom:calc(24px + env(safe-area-inset-bottom,0px));
    display:flex;
    flex-direction:column;
    gap:10px;
    pointer-events:auto;
  }
  .ctrl{
    background:rgba(6,20,32,0.55);
    border:1px solid rgba(127,216,208,0.35);
    border-radius:3px;
    padding:10px 14px;
    min-width:190px;
    backdrop-filter:blur(6px);
  }
  .ctrl label{
    display:flex;
    justify-content:space-between;
    font-size:12px;
    color:var(--accent);
    margin-bottom:4px;
  }
  .ctrl input[type=range]{
    width:100%;
    accent-color:var(--accent);
  }
  #hint{
    position:fixed;
    left:32px;
    bottom:calc(24px + env(safe-area-inset-bottom,0px));
    font-size:12px;
    color:rgba(220,234,245,0.55);
    pointer-events:none;
  }
  @media (max-width:640px){
    #title{font-size:17px}
    .ctrl{min-width:150px;padding:8px 10px;}
    #hint{display:none}
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="hud">
  <div id="title">a low-poly sea</div>
</div>
<div id="hint">drag to look · WASD to move · shift to run · space to jump · T for 3rd person · F to fly · E to board/leave the boat</div>
<div id="controls">
  <div class="ctrl">
    <label><span>swell</span><span id="swellVal">1.0</span></label>
    <input id="swell" type="range" min="0.2" max="2.5" step="0.05" value="1.0">
  </div>
  <div class="ctrl">
    <label><span>chop</span><span id="chopVal">1.0</span></label>
    <input id="chop" type="range" min="0" max="2.5" step="0.05" value="1.0">
  </div>
  <div class="ctrl">
    <label><span>speed</span><span id="speedVal">1.0</span></label>
    <input id="speed" type="range" min="0" max="3" step="0.05" value="1.0">
  </div>
  <div class="ctrl">
    <label><span>sun time</span><span id="sunTimeVal">14:00</span></label>
    <input id="sunTime" type="range" min="0" max="24" step="0.05" value="14">
  </div>
  <div class="ctrl">
    <label><span>sun height</span><span id="sunHeightVal">1.00</span></label>
    <input id="sunHeight" type="range" min="0.15" max="2.5" step="0.05" value="1">
  </div>
  <div class="ctrl">
    <label><span>sun intensity</span><span id="sunIntensityVal">1.10</span></label>
    <input id="sunIntensity" type="range" min="0" max="2.5" step="0.05" value="1.1">
  </div>
  <div class="ctrl">
    <label><span>cycle speed</span><span id="cycleSpeedVal">0.00</span></label>
    <input id="cycleSpeed" type="range" min="0" max="0.25" step="0.005" value="0">
  </div>
  <div class="ctrl">
    <label><span>wind dir</span><span id="windDirVal">30°</span></label>
    <input id="windDir" type="range" min="0" max="359" step="1" value="30">
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
  var scene = new THREE.Scene();
  scene.fog = new THREE.FogExp2(0x061421, 0.006);

  var camera = new THREE.PerspectiveCamera(50, window.innerWidth/window.innerHeight, 0.1, 2000);
  // Start standing on the beach at the water's edge, facing out over the ocean.
  camera.position.set(0, 12, 315);

  var renderer = new THREE.WebGLRenderer({antialias:true});
  renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
  renderer.setSize(window.innerWidth, window.innerHeight);
  document.getElementById('app').appendChild(renderer.domElement);

  // Dynamic sun + moon lighting
  var ambient = new THREE.AmbientLight(0x3a5570, 0.9);
  scene.add(ambient);

  var sun = new THREE.DirectionalLight(0xfff0c2, 1.1);
  sun.position.set(120, 140, 40);
  scene.add(sun);

  var moon = new THREE.DirectionalLight(0xbfe3ff, 0.25);
  moon.position.set(-120, 90, -80);
  scene.add(moon);

  var warm = new THREE.DirectionalLight(0xff9d6c, 0.22);
  warm.position.set(80, 20, 60);
  scene.add(warm);

  // Sky gradient dome (cheap: large sphere, back side, vertex colors)
  var skyGeo = new THREE.SphereGeometry(900, 16, 12);
  var skyMat = new THREE.MeshBasicMaterial({color:0x0a1a2b, side:THREE.BackSide, fog:false});
  scene.add(new THREE.Mesh(skyGeo, skyMat));

  // Faceted low-poly moon.
  var moonGroup = new THREE.Group();
  var moonMesh = new THREE.Mesh(
    new THREE.IcosahedronGeometry(24, 1),
    new THREE.MeshLambertMaterial({
      color:0xe9e6d7,
      flatShading:true,
      fog:false
    })
  );
  moonGroup.add(moonMesh);

  // Small dark faceted craters to give the moon a low-poly design.
  var craterMat = new THREE.MeshBasicMaterial({color:0xb7b29f, fog:false});
  var moonCrater1 = new THREE.Mesh(new THREE.IcosahedronGeometry(5.5, 1), craterMat);
  moonCrater1.position.set(-16, 7, 16);
  moonCrater1.scale.set(1, 0.55, 0.32);
  moonGroup.add(moonCrater1);

  var moonCrater2 = new THREE.Mesh(new THREE.IcosahedronGeometry(3.5, 1), craterMat);
  moonCrater2.position.set(10, -6, 17);
  moonCrater2.scale.set(1.15, 0.7, 0.28);
  moonGroup.add(moonCrater2);

  var moonCrater3 = new THREE.Mesh(new THREE.IcosahedronGeometry(2.6, 1), craterMat);
  moonCrater3.position.set(1, 12, 18);
  moonCrater3.scale.set(0.9, 0.65, 0.25);
  moonGroup.add(moonCrater3);

  moonGroup.position.set(-260, 220, -420);
  scene.add(moonGroup);

  // Faceted low-poly sun.
  var sunMesh = new THREE.Mesh(
    new THREE.IcosahedronGeometry(20, 1),
    new THREE.MeshBasicMaterial({
      color:0xffdf7e,
      flatShading:true,
      fog:false
    })
  );
  scene.add(sunMesh);

  // Ocean plane
  var SIZE = 600, SEG = 90;
  var geo = new THREE.PlaneGeometry(SIZE, SIZE, SEG, SEG);
  geo.rotateX(-Math.PI/2);

  var colorA = new THREE.Color(0x0f4c66); // trough
  var colorB = new THREE.Color(0x3fb8c4); // crest
  var colors = [];
  for (var i=0;i<geo.attributes.position.count;i++) colors.push(1,1,1);
  geo.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));

  var mat = new THREE.MeshStandardMaterial({
    vertexColors: true,
    flatShading: true,
    roughness: 0.55,
    metalness: 0.0,
    emissive: 0x061c22,
    emissiveIntensity: 0.35,
    side: THREE.DoubleSide,
    fog: false
  });
  var ocean = new THREE.Mesh(geo, mat);
  scene.add(ocean);

  // Low-poly island: sandy beach, grassy hill, rocky peak, and a few palms.
  var islandGroup = new THREE.Group();
  function makeGrassTexture(){
    var size = 128;
    var canvas = document.createElement('canvas');
    canvas.width = size; canvas.height = size;
    var ctx = canvas.getContext('2d');
    ctx.fillStyle = '#4f7a3d';
    ctx.fillRect(0, 0, size, size);
    for (var i = 0; i < 950; i++){
      var gx = Math.random() * size, gy = Math.random() * size;
      var shade = 0.72 + Math.random() * 0.55;
      var r = Math.floor(70 * shade), g = Math.floor(118 * shade), b = Math.floor(58 * shade);
      ctx.fillStyle = 'rgb(' + r + ',' + g + ',' + b + ')';
      var w = 1 + Math.random() * 1.6, h = 3 + Math.random() * 5;
      ctx.save();
      ctx.translate(gx, gy);
      ctx.rotate((Math.random() - 0.5) * 0.7);
      ctx.fillRect(-w / 2, -h, w, h);
      ctx.restore();
    }
    var tex = new THREE.CanvasTexture(canvas);
    tex.wrapS = THREE.RepeatWrapping;
    tex.wrapT = THREE.RepeatWrapping;
    tex.repeat.set(48, 48);
    return tex;
  }
  var grassTexture = makeGrassTexture();

  var sandMat = new THREE.MeshStandardMaterial({color:0xe0c98f, flatShading:true, roughness:0.9, fog:false});
  var grassMat = new THREE.MeshStandardMaterial({color:0xffffff, map:grassTexture, flatShading:true, roughness:0.85, fog:false});
  var rockMat = new THREE.MeshStandardMaterial({color:0x8a8578, flatShading:true, roughness:0.95, fog:false});

  var beachH = 7, hillH = 30;
  var beach = new THREE.Mesh(new THREE.CylinderGeometry(26, 34, beachH, 7, 1), sandMat);
  beach.position.y = beachH / 2;
  islandGroup.add(beach);

  var hill = new THREE.Mesh(new THREE.CylinderGeometry(3, 24, hillH, 7, 2), grassMat);
  hill.position.y = beachH + hillH / 2;
  islandGroup.add(hill);

  var peak = new THREE.Mesh(new THREE.IcosahedronGeometry(4.5, 0), rockMat);
  peak.position.y = beachH + hillH + 1.5;
  islandGroup.add(peak);

  function makePalm(x, z, scale){
    var group = new THREE.Group();
    var trunk = new THREE.Mesh(
      new THREE.CylinderGeometry(0.4, 0.6, 8, 5),
      new THREE.MeshStandardMaterial({color:0x6b4a2f, flatShading:true, fog:false})
    );
    trunk.position.y = 4;
    trunk.rotation.z = 0.15;
    group.add(trunk);
    var frondMat = new THREE.MeshStandardMaterial({color:0x3f8f4a, flatShading:true, side:THREE.DoubleSide, fog:false});
    for (var i = 0; i < 5; i++){
      var frond = new THREE.Mesh(new THREE.ConeGeometry(1.2, 4.5, 4), frondMat);
      frond.position.set(0, 8, 0);
      frond.rotation.z = Math.PI / 2.2;
      frond.rotation.y = i * (Math.PI * 2 / 5);
      group.add(frond);
    }
    group.position.set(x, beachH, z);
    group.scale.setScalar(scale);
    return group;
  }
  islandGroup.add(makePalm(14, 10, 1.0));
  islandGroup.add(makePalm(-16, 6, 0.85));
  islandGroup.add(makePalm(5, -18, 0.9));

  islandGroup.position.set(-110, 0, -90);
  scene.add(islandGroup);

  // Water/land boundary used for movement collision later on.
  var WATER_EDGE = 290;
  var LAND_OUTER_EDGE = 555; // the mountain wall: solid, you bump into it
  var ISLAND_CENTER = {x:-110, z:-90}, ISLAND_LAND_RADIUS = 34;
  function isWater(x, z){
    if (Math.max(Math.abs(x), Math.abs(z)) >= WATER_EDGE) return false;
    var dx = x - ISLAND_CENTER.x, dz = z - ISLAND_CENTER.z;
    return Math.sqrt(dx*dx + dz*dz) >= ISLAND_LAND_RADIUS;
  }
  function blockedForWalking(x, z){
    return isWater(x, z) || Math.max(Math.abs(x), Math.abs(z)) > LAND_OUTER_EDGE;
  }

  // Real altitude difference between sand and grass — tall enough that
  // you have to jump to get up from the beach onto the grass. Levels are
  // the actual mesh surface height plus a normal eye height, so the
  // camera sits right on the ground instead of floating above it.
  var EYE_HEIGHT = 5;
  var SAND_LEVEL = 1.8;    // top of the shore sand frame (feet level)
  var GRASS_LEVEL = 6.5;   // top of the shore grass frame (feet level)
  var ISLAND_LEVEL = 7;    // top of the standalone island's beach (feet level)
  var SAND_GRASS_BOUNDARY = 344;
  function groundHeightAt(x, z){
    var idx = x - ISLAND_CENTER.x, idz = z - ISLAND_CENTER.z;
    if (Math.sqrt(idx*idx + idz*idz) < ISLAND_LAND_RADIUS) return ISLAND_LEVEL;
    return Math.max(Math.abs(x), Math.abs(z)) < SAND_GRASS_BOUNDARY ? SAND_LEVEL : GRASS_LEVEL;
  }

  // Small low-poly props: rocks, bushes, trees.
  var stoneMat = new THREE.MeshStandardMaterial({color:0x9a978c, flatShading:true, roughness:1, fog:false});
  var bushMat = new THREE.MeshStandardMaterial({color:0x3f7a3f, flatShading:true, roughness:0.9, fog:false});
  var trunkMat2 = new THREE.MeshStandardMaterial({color:0x5c4530, flatShading:true, fog:false});

  function makeRock(s){
    var m = new THREE.Mesh(new THREE.IcosahedronGeometry(1, 0), stoneMat);
    m.scale.set(s*(0.8+Math.random()*0.6), s*(0.5+Math.random()*0.5), s*(0.8+Math.random()*0.6));
    m.rotation.set(Math.random()*Math.PI, Math.random()*Math.PI, Math.random()*Math.PI);
    return m;
  }
  function makeBush(s){
    var g = new THREE.Group();
    for (var i=0;i<3;i++){
      var lobe = new THREE.Mesh(new THREE.IcosahedronGeometry(1, 0), bushMat);
      lobe.position.set((Math.random()-0.5)*1.2, 0.5+Math.random()*0.3, (Math.random()-0.5)*1.2);
      lobe.scale.setScalar(0.8+Math.random()*0.5);
      g.add(lobe);
    }
    g.scale.setScalar(s);
    return g;
  }
  function makeTree(s){
    var g = new THREE.Group();
    var trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.35,0.5,6,6), trunkMat2);
    trunk.position.y = 3;
    g.add(trunk);
    var top = new THREE.Mesh(new THREE.IcosahedronGeometry(3, 0), grassMat.map ? bushMat : grassMat);
    top.position.y = 7.5;
    top.scale.set(1,1.15,1);
    g.add(top);
    g.scale.setScalar(s);
    return g;
  }

  var propGroup = new THREE.Group();
  function scatterProps(count, maker, minR, maxR, cx, cz){
    var placed = 0, tries = 0;
    while (placed < count && tries < count * 12){
      tries++;
      var a = Math.random() * Math.PI * 2;
      var r = minR + Math.random() * (maxR - minR);
      var x = cx + Math.cos(a) * r, z = cz + Math.sin(a) * r;
      if (isWater(x, z)) continue;
      var p = maker(0.7 + Math.random() * 0.8);
      p.position.set(x, 0, z);
      propGroup.add(p);
      placed++;
    }
  }
  // Around the main shore/grass band.
  scatterProps(26, makeTree, 300, 560, 0, 0);
  scatterProps(30, makeBush, 295, 570, 0, 0);
  scatterProps(40, makeRock, 285, 600, 0, 0);
  // On and around the standalone island.
  scatterProps(4, makeTree, 0, 30, ISLAND_CENTER.x, ISLAND_CENTER.z);
  scatterProps(6, makeBush, 0, 32, ISLAND_CENTER.x, ISLAND_CENTER.z);
  scatterProps(8, makeRock, 0, 36, ISLAND_CENTER.x, ISLAND_CENTER.z);
  scene.add(propGroup);

  // Instanced 3D grass blades across the grassy land band.
  var bladeGeo = new THREE.BoxGeometry(0.12, 1, 0.05);
  bladeGeo.translate(0, 0.5, 0);
  var bladeMat = new THREE.MeshStandardMaterial({color:0x5b9a4f, flatShading:true, side:THREE.DoubleSide, fog:false});
  var GRASS_COUNT = 4000;
  var grassBlades = new THREE.InstancedMesh(bladeGeo, bladeMat, GRASS_COUNT);
  var gdummy = new THREE.Object3D();
  var gplaced = 0, gtries = 0;
  while (gplaced < GRASS_COUNT && gtries < GRASS_COUNT * 4){
    gtries++;
    var gx2 = (Math.random()*2-1) * 560, gz2 = (Math.random()*2-1) * 560;
    if (isWater(gx2, gz2)) continue;
    if (Math.max(Math.abs(gx2), Math.abs(gz2)) < 300) continue; // skip sandy beach ring
    gdummy.position.set(gx2, 6.4, gz2);
    gdummy.rotation.y = Math.random() * Math.PI * 2;
    var gs = 0.6 + Math.random() * 0.9;
    gdummy.scale.set(gs, gs * (0.7 + Math.random() * 0.7), gs);
    gdummy.updateMatrix();
    grassBlades.setMatrixAt(gplaced, gdummy.matrix);
    gplaced++;
  }
  scene.add(grassBlades);

  // Land surrounding the ocean on every side: a square frame with a
  // square hole over the water, sandy near the shore and grassy beyond it.
  function makeShoreFrame(innerHalf, outerHalf, thickness, material, baseY){
    var shape = new THREE.Shape();
    shape.moveTo(-outerHalf, -outerHalf);
    shape.lineTo(outerHalf, -outerHalf);
    shape.lineTo(outerHalf, outerHalf);
    shape.lineTo(-outerHalf, outerHalf);
    shape.lineTo(-outerHalf, -outerHalf);
    var hole = new THREE.Path();
    hole.moveTo(-innerHalf, -innerHalf);
    hole.lineTo(-innerHalf, innerHalf);
    hole.lineTo(innerHalf, innerHalf);
    hole.lineTo(innerHalf, -innerHalf);
    hole.lineTo(-innerHalf, -innerHalf);
    shape.holes.push(hole);
    var extrudeGeo = new THREE.ExtrudeGeometry(shape, {depth: thickness, bevelEnabled: false, curveSegments: 1});
    extrudeGeo.rotateX(-Math.PI / 2);
    var mesh = new THREE.Mesh(extrudeGeo, material);
    mesh.position.y = baseY;
    return mesh;
  }

  var shoreSand = makeShoreFrame(280, 350, 3, sandMat, -1.2);
  scene.add(shoreSand);
  var shoreGrass = makeShoreFrame(344, 650, 6, grassMat, 0.5);
  scene.add(shoreGrass);

  // A dense wall of low-poly mountains following the square edge of the
  // land (corners included), tall and overlapping enough that the edge
  // of the map is never visible past them.
  function squarePerimeterPoint(t, half){
    var side = ((t % 1) + 1) % 1 * 4;
    var i = Math.floor(side), f = side - i;
    if (i === 0) return {x: -half + f * 2 * half, z: -half};
    if (i === 1) return {x: half, z: -half + f * 2 * half};
    if (i === 2) return {x: half - f * 2 * half, z: half};
    return {x: -half, z: half - f * 2 * half};
  }
  var mountainGroup = new THREE.Group();
  var mCount = 34, mHalf = 600;
  for (var mi = 0; mi < mCount; mi++){
    var p = squarePerimeterPoint(mi / mCount + (Math.random()-0.5)*0.01, mHalf);
    var jitter = (Math.random() - 0.3) * 45;
    var dirLen = Math.hypot(p.x, p.z) || 1;
    var px = p.x + (p.x / dirLen) * jitter;
    var pz = p.z + (p.z / dirLen) * jitter;
    var mh = 90 + Math.random() * 130;
    var mr = 70 + Math.random() * 60;
    var peakMesh = new THREE.Mesh(new THREE.ConeGeometry(mr, mh, 6), Math.random() > 0.4 ? grassMat : rockMat);
    peakMesh.position.set(px, mh / 2 - 2, pz);
    peakMesh.rotation.y = Math.random() * Math.PI;
    mountainGroup.add(peakMesh);
  }
  scene.add(mountainGroup);

  var basePos = geo.attributes.position.array.slice();

  // Low-poly sailboat, bobbing on the wave surface.
  var boat = new THREE.Group();
  var hull = new THREE.Mesh(
    new THREE.ConeGeometry(3.4, 10, 4),
    new THREE.MeshStandardMaterial({color:0x8a5a3a, flatShading:true, roughness:0.8, fog:false})
  );
  hull.rotation.x = Math.PI / 2;
  hull.rotation.y = Math.PI / 4;
  hull.scale.set(1, 1, 0.55);
  boat.add(hull);
  var mast = new THREE.Mesh(
    new THREE.CylinderGeometry(0.18, 0.18, 9, 6),
    new THREE.MeshStandardMaterial({color:0xe8e2d0, flatShading:true, fog:false})
  );
  mast.position.y = 4.3;
  boat.add(mast);
  var sail = new THREE.Mesh(
    new THREE.ConeGeometry(3, 7.5, 3),
    new THREE.MeshStandardMaterial({color:0xf5f1e6, flatShading:true, side:THREE.DoubleSide, fog:false})
  );
  sail.rotation.z = Math.PI / 2;
  sail.rotation.y = Math.PI / 2;
  sail.position.set(0.3, 4.5, 0);
  boat.add(sail);
  // A simple bean-shaped character, standing on the boat deck.
  var beanMat = new THREE.MeshStandardMaterial({color:0xf2c14e, flatShading:true, roughness:0.7, fog:false});
  var bean = new THREE.Group();
  var beanBody = new THREE.Mesh(new THREE.SphereGeometry(1.3, 8, 6), beanMat);
  beanBody.scale.set(0.85, 1.35, 0.85);
  bean.add(beanBody);
  var beanHead = new THREE.Mesh(new THREE.SphereGeometry(0.85, 8, 6), beanMat);
  beanHead.position.y = 1.75;
  bean.add(beanHead);
  bean.position.set(0, 3.1, 0.5);
  boat.add(bean);

  var boatX = 10, boatZ = 275;
  boat.position.set(boatX, 0, boatZ);
  scene.add(boat);

  // A separate bean, standing on the ground, feet at its own origin —
  // shown only while walking in third-person mode.
  var landBean = new THREE.Group();
  var landBeanBody = new THREE.Mesh(new THREE.SphereGeometry(1.3, 8, 6), beanMat);
  landBeanBody.scale.set(0.85, 1.35, 0.85);
  landBeanBody.position.y = 1.75;
  landBean.add(landBeanBody);
  var landBeanHead = new THREE.Mesh(new THREE.SphereGeometry(0.85, 8, 6), beanMat);
  landBeanHead.position.y = 3.5;
  landBean.add(landBeanHead);
  landBean.visible = false;
  scene.add(landBean);

  function updateBoat(t){
    var epsB = 1.5;
    var y = waveHeight(boatX, boatZ, t);
    var hx = waveHeight(boatX+epsB, boatZ, t) - waveHeight(boatX-epsB, boatZ, t);
    var hz = waveHeight(boatX, boatZ+epsB, t) - waveHeight(boatX, boatZ-epsB, t);
    boat.position.x = boatX;
    boat.position.z = boatZ;
    boat.position.y = y + 0.6;
    boat.rotation.z = -hx * 0.05;
    boat.rotation.x = hz * 0.05;
  }

  // Star field, fades in at night.
  var starGeo = new THREE.BufferGeometry();
  var starCount = 700;
  var starPos = new Float32Array(starCount * 3);
  for (var s = 0; s < starCount; s++){
    var r = 850;
    var theta = Math.random() * Math.PI * 2;
    var phi = Math.random() * Math.PI * 0.5; // upper hemisphere
    starPos[s*3]   = r * Math.sin(phi) * Math.cos(theta);
    starPos[s*3+1] = r * Math.cos(phi);
    starPos[s*3+2] = r * Math.sin(phi) * Math.sin(theta);
  }
  starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
  var starMat = new THREE.PointsMaterial({color:0xffffff, size:2.4, transparent:true, opacity:0, fog:false});
  var stars = new THREE.Points(starGeo, starMat);
  scene.add(stars);

  var params = {
    swell:1.0, chop:1.0, speed:1.0,
    sunTime:14.0, sunHeight:1.0, sunIntensity:1.1,
    cycleSpeed:0.0, windDir:30
  };

  var windAngle = 0;
  function updateWind(){
    windAngle = params.windDir * Math.PI / 180;
    updateWaveDirections();
    document.getElementById('windDirVal').textContent = Math.round(params.windDir) + '°';
  }

  // A handful of sine waves at different directions, wavelengths, and
  // speeds. Each direction is an offset from the wind angle, and the
  // frequencies/speeds are deliberately non-multiples of each other so
  // the crests never line up into a visible repeating grid.
  var WAVE_SET = [
    {dirOffset: 0.00, freq: 0.021, speed: 0.55, amp: 3.0, band: 'swell'},
    {dirOffset: 0.52, freq: 0.014, speed: -0.31, amp: 2.1, band: 'swell'},
    {dirOffset: -0.83, freq: 0.027, speed: 0.44, amp: 1.5, band: 'swell'},
    {dirOffset: 1.30, freq: 0.037, speed: 0.83, amp: 1.4, band: 'chop'},
    {dirOffset: -0.41, freq: 0.049, speed: -0.68, amp: 1.05, band: 'chop'},
    {dirOffset: 2.10, freq: 0.065, speed: 1.21, amp: 0.8, band: 'chop'},
    {dirOffset: -1.65, freq: 0.093, speed: -1.7, amp: 0.5, band: 'chop'},
    {dirOffset: 0.95, freq: 0.118, speed: 2.3, amp: 0.32, band: 'chop'}
  ];
  var waveDirX = new Float64Array(WAVE_SET.length);
  var waveDirZ = new Float64Array(WAVE_SET.length);
  function updateWaveDirections(){
    for (var wi = 0; wi < WAVE_SET.length; wi++){
      var a = windAngle + WAVE_SET[wi].dirOffset;
      waveDirX[wi] = Math.cos(a);
      waveDirZ[wi] = Math.sin(a);
    }
  }

  function bindSlider(id, key, valId){
    var el = document.getElementById(id);
    var val = document.getElementById(valId);
    el.addEventListener('input', function(){
      params[key] = parseFloat(el.value);
      updateSun();
    });
  }

  bindSlider('swell','swell','swellVal');
  bindSlider('chop','chop','chopVal');
  bindSlider('speed','speed','speedVal');
  bindSlider('sunTime','sunTime','sunTimeVal');
  bindSlider('sunHeight','sunHeight','sunHeightVal');
  bindSlider('sunIntensity','sunIntensity','sunIntensityVal');
  bindSlider('cycleSpeed','cycleSpeed','cycleSpeedVal');
  document.getElementById('windDir').addEventListener('input', function(e){
    params.windDir = parseFloat(e.target.value);
    updateWind();
  });

  function formatTime(hours){
    var h = Math.floor(hours) % 24;
    var m = Math.floor((hours - Math.floor(hours)) * 60);
    return String(h).padStart(2,'0') + ':' + String(m).padStart(2,'0');
  }

  function updateSun(){
    var time = params.sunTime;
    var angle = (time / 24) * Math.PI * 2 - Math.PI / 2;

    // Sun and moon share a single circle (centered on the world origin,
    // at a fixed depth) and sit at exactly opposite points on it, so the
    // moment the sun dips below the horizon on one side, the moon is
    // rising on the other.
    var radiusH = 170, radiusV = 175 * params.sunHeight, depth = 45;
    var sunX = Math.cos(angle) * radiusH;
    var sunY = Math.sin(angle) * radiusV;

    sun.position.set(sunX, sunY, depth);
    sun.target.position.set(0, 0, 0);
    if (!sun.target.parent) scene.add(sun.target);

    var moonX = -sunX, moonY = -sunY;
    moon.position.set(moonX, moonY, depth);
    moon.target.position.set(0, 0, 0);
    if (!moon.target.parent) scene.add(moon.target);

    var daylight = Math.max(0, Math.sin(angle));
    var twilight = Math.max(0, 1 - Math.abs(Math.sin(angle)));

    // Keep the sun strongly visible as the source of illumination.
    sun.intensity = params.sunIntensity * (0.04 + 1.15 * daylight);

    // Moon brightens as the sun's contribution fades.
    moon.intensity = 0.05 + 0.4 * Math.max(0, -Math.sin(angle));
    ambient.intensity = 0.24 + 0.72 * daylight;
    warm.intensity = 0.08 + 0.55 * twilight;

    // Warm at sunrise/sunset, pale yellow at daytime.
    var sunColor = new THREE.Color();
    if (daylight < 0.28) {
      sunColor.setHSL(0.075, 0.78, 0.68);
    } else {
      sunColor.setHSL(0.13, 0.32, 0.92);
    }
    sun.color.copy(sunColor);

    // Visible sun and moon meshes follow their light positions outward.
    sunMesh.position.copy(sun.position).multiplyScalar(2.35);
    sunMesh.lookAt(camera.position);

    moonGroup.position.copy(moon.position).multiplyScalar(2.35);
    moonGroup.lookAt(camera.position);

    starMat.opacity = THREE.MathUtils.clamp(1 - daylight * 1.4, 0, 0.85);

    // Labels.
    document.getElementById('sunTimeVal').textContent = formatTime(time);
    document.getElementById('sunHeightVal').textContent = params.sunHeight.toFixed(2);
    document.getElementById('sunIntensityVal').textContent = params.sunIntensity.toFixed(2);
    document.getElementById('cycleSpeedVal').textContent = params.cycleSpeed.toFixed(3);
  }

  // Sun direction used for the wave glow.
  var sunDir = new THREE.Vector3();
  updateWind();
  updateSun();

  var oceanHalf = SIZE / 2;
  function shoreFalloff(x, z){
    // 1.0 through the middle of the ocean, fading smoothly to 0 as the
    // plane approaches its outer edge, so the surface settles flat and
    // flush with the fixed-height shore around it instead of poking
    // through or leaving a gap.
    var d = Math.max(Math.abs(x), Math.abs(z)) / oceanHalf;
    var t = THREE.MathUtils.clamp((d - 0.72) / 0.28, 0, 1);
    return 1 - t * t * (3 - 2 * t);
  }

  function waveHeight(x, z, t){
    var swell = params.swell, chop = params.chop;
    var h = 0;
    for (var wi = 0; wi < WAVE_SET.length; wi++){
      var w = WAVE_SET[wi];
      var proj = x * waveDirX[wi] + z * waveDirZ[wi];
      var amp = w.amp * (w.band === 'swell' ? swell : chop);
      h += Math.sin(proj * w.freq + t * w.speed) * amp;
    }
    return h * shoreFalloff(x, z);
  }

  var pos = geo.attributes.position;
  var col = geo.attributes.color;
  var tmpColor = new THREE.Color();
  var minH = -6, maxH = 6;

  function updateOcean(t){
    // The glow is calculated from the SUN'S ACTUAL POSITION.
    // Camera position has no influence on it.
    sunDir.copy(sun.position).normalize();

    // Small offsets used to estimate the local polygon surface slope.
    var eps = 1.2;
    var lightColor = new THREE.Color(0xfff0b0);
    var glowColor = new THREE.Color(0xb8fff0);
    var foamColor = new THREE.Color(0xf3faff);

    for (var i=0; i<pos.count; i++){
      var ix = i * 3;
      var x = basePos[ix];
      var z = basePos[ix+2];

      var y = waveHeight(x, z, t);
      pos.array[ix+1] = y;

      // Base low-poly ocean colour.
      var f = THREE.MathUtils.clamp((y - minH)/(maxH-minH), 0, 1);
      tmpColor.copy(colorA).lerp(colorB, f);

      // Calculate the actual local wave normal from the wave surface.
      var hx = waveHeight(x + eps, z, t) - waveHeight(x - eps, z, t);
      var hz = waveHeight(x, z + eps, t) - waveHeight(x, z - eps, t);

      var nx = -hx / (2 * eps);
      var ny = 1.0;
      var nz = -hz / (2 * eps);

      var len = Math.sqrt(nx*nx + ny*ny + nz*nz);
      nx /= len;
      ny /= len;
      nz /= len;

      // How directly this polygon faces the sun.
      // 0 = facing away, 1 = facing directly toward the sun.
      var sunDot = Math.max(0, nx*sunDir.x + ny*sunDir.y + nz*sunDir.z);

      // Sharpen the highlight so it creates a visible sun-reflection band.
      var directionalGlow = Math.pow(sunDot, 5.0);

      // Higher wave faces catch a little more of the sunlight.
      var crestBoost = 0.35 + 0.65 * f;

      // Strongly directional sunlight. No camera-distance term.
      var glowAmount = directionalGlow * crestBoost * params.sunIntensity;

      // Add warm sunlight first.
      var warmAmount = Math.min(1, glowAmount * 0.75);
      tmpColor.lerp(lightColor, warmAmount * 0.42);

      // Add the brighter water glow on faces aimed at the sun.
      var aquaAmount = Math.min(1, glowAmount * 0.95);
      tmpColor.lerp(glowColor, aquaAmount * 0.62);

      // Whitecap foam on the highest crests.
      if (f > 0.8) {
        tmpColor.lerp(foamColor, Math.min(1, (f - 0.8) / 0.2) * 0.85);
      }

      col.array[ix]   = tmpColor.r;
      col.array[ix+1] = tmpColor.g;
      col.array[ix+2] = tmpColor.b;
    }

    pos.needsUpdate = true;
    col.needsUpdate = true;
    geo.computeVertexNormals();

    // A small global emission keeps distant ocean polygons from becoming
    // dark due to ordinary scene lighting. The directional highlight above
    // is what determines WHERE the glow appears.
    var daylight = Math.max(0, sunDir.y);
    mat.emissiveIntensity = 0.16 + 0.34 * daylight * params.sunIntensity;
  }

  // Free-fly camera: drag/touch to look, WASD/arrows to move, Q/E or Space/Shift for up/down
  var yaw = Math.PI, pitch = -0.22;
  var dragging = false, lastX=0, lastY=0, autoDrift = true;
  var dom = renderer.domElement;
  dom.style.cursor = 'grab';
  dom.style.touchAction = 'none';

  function pointerDown(x,y){ dragging=true; autoDrift=false; lastX=x; lastY=y; dom.style.cursor='grabbing'; }
  function pointerMove(x,y){
    if(!dragging) return;
    yaw -= (x-lastX) * 0.004;
    pitch -= (y-lastY) * 0.003;
    pitch = Math.max(-1.3, Math.min(1.3, pitch));
    lastX=x; lastY=y;
  }
  function pointerUp(){ dragging=false; dom.style.cursor='grab'; }

  dom.addEventListener('mousedown', function(e){ pointerDown(e.clientX,e.clientY); });
  window.addEventListener('mousemove', function(e){ pointerMove(e.clientX,e.clientY); });
  window.addEventListener('mouseup', pointerUp);
  dom.addEventListener('touchstart', function(e){ var t=e.touches[0]; pointerDown(t.clientX,t.clientY); }, {passive:true});
  window.addEventListener('touchmove', function(e){ var t=e.touches[0]; pointerMove(t.clientX,t.clientY); }, {passive:true});
  window.addEventListener('touchend', pointerUp);

  var keys = {};
  var flying = false;
  var verticalVelocity = 0, grounded = true;
  var JUMP_SPEED = 19, GRAVITY = 30; // clears the ~4-unit sand-to-grass step with some margin
  var STEP_EPS = 0.5;
  var onBoat = false, MOUNT_RANGE = 16;
  var thirdPerson = false;
  // The player's real simulated position while walking. In first person
  // the camera sits exactly here; in third person the camera pulls back
  // and this is where the bean stands instead.
  var playerX = camera.position.x, playerY = camera.position.y, playerZ = camera.position.z;
  window.addEventListener('keydown', function(e){
    keys[e.code] = true;
    if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].indexOf(e.code) !== -1) e.preventDefault();
    autoDrift = false;
    if (e.code === 'KeyF' && !e.repeat){
      flying = !flying;
      if (flying){
        thirdPerson = false;
      } else {
        verticalVelocity = 0;
        grounded = true;
      }
    }
    if (e.code === 'Space' && !e.repeat && !flying && grounded){
      verticalVelocity = JUMP_SPEED;
      grounded = false;
    }
    if (e.code === 'KeyT' && !e.repeat && !flying && !onBoat){
      thirdPerson = !thirdPerson;
    }
    if (e.code === 'KeyE' && !e.repeat && !flying){
      if (!onBoat){
        var bdx = playerX - boatX, bdz = playerZ - boatZ;
        if (Math.sqrt(bdx*bdx + bdz*bdz) < MOUNT_RANGE) onBoat = true;
      } else {
        // Only step off where the boat is actually near solid ground.
        var edx = boatX - ISLAND_CENTER.x, edz = boatZ - ISLAND_CENTER.z;
        var nearIsland = Math.sqrt(edx*edx + edz*edz) < ISLAND_LAND_RADIUS + MOUNT_RANGE;
        var nearShore = Math.max(Math.abs(boatX), Math.abs(boatZ)) > WATER_EDGE - MOUNT_RANGE;
        if (nearIsland || nearShore){
          onBoat = false;
          // Resume walking from wherever the boat currently is.
          playerX = boatX; playerZ = boatZ;
          playerY = groundHeightAt(boatX, boatZ);
          grounded = true; verticalVelocity = 0;
        }
      }
    }
  }, {passive:false});
  window.addEventListener('keyup', function(e){ keys[e.code] = false; });

  var moveSpeed = 26; // units per second
  var forward = new THREE.Vector3(), right = new THREE.Vector3(), up = new THREE.Vector3(0,1,0);
  var flatForward = new THREE.Vector3(), flatRight = new THREE.Vector3();

  var clock = new THREE.Clock();

  function animate(){
    requestAnimationFrame(animate);
    var dt = clock.getDelta();
    var t = clock.elapsedTime * params.speed;

    // cycleSpeed is hours of simulated time per second.
    if (params.cycleSpeed > 0) {
      params.sunTime = (params.sunTime + dt * params.cycleSpeed) % 24;
      document.getElementById('sunTime').value = params.sunTime;
    }
    updateSun();

    if (autoDrift) yaw += dt * 0.03;

    forward.set(Math.sin(yaw)*Math.cos(pitch), Math.sin(pitch), Math.cos(yaw)*Math.cos(pitch));
    right.set(Math.sin(yaw - Math.PI/2), 0, Math.cos(yaw - Math.PI/2));

    var running = keys['ShiftLeft']||keys['ShiftRight'];
    var dist = moveSpeed * dt * (running ? 4.5 : 1);

    if (flying){
      landBean.visible = false;
      if (keys['KeyW']||keys['ArrowUp'])    camera.position.addScaledVector(forward, dist);
      if (keys['KeyS']||keys['ArrowDown'])  camera.position.addScaledVector(forward, -dist);
      if (keys['KeyD']||keys['ArrowRight']) camera.position.addScaledVector(right, dist);
      if (keys['KeyA']||keys['ArrowLeft'])  camera.position.addScaledVector(right, -dist);
      if (keys['KeyE']||keys['Space'])      camera.position.addScaledVector(up, dist);
      if (keys['KeyQ']||keys['ControlLeft'])camera.position.addScaledVector(up, -dist);
      camera.position.y = Math.max(camera.position.y, -8);
    } else if (onBoat){
      landBean.visible = false;
      // Driving the boat: confined to water, blocked by land.
      flatForward.set(Math.sin(yaw), 0, Math.cos(yaw));
      flatRight.set(Math.sin(yaw - Math.PI/2), 0, Math.cos(yaw - Math.PI/2));
      var boatDist = moveSpeed * dt * (running ? 2.0 : 1);
      var mx = 0, mz = 0;
      if (keys['KeyW']||keys['ArrowUp'])    { mx += flatForward.x; mz += flatForward.z; }
      if (keys['KeyS']||keys['ArrowDown'])  { mx -= flatForward.x; mz -= flatForward.z; }
      if (keys['KeyD']||keys['ArrowRight']) { mx += flatRight.x;   mz += flatRight.z; }
      if (keys['KeyA']||keys['ArrowLeft'])  { mx -= flatRight.x;   mz -= flatRight.z; }
      var tryX = boatX + mx * boatDist;
      var tryZ = boatZ + mz * boatDist;
      if (isWater(tryX, boatZ)) boatX = tryX;
      if (isWater(boatX, tryZ)) boatZ = tryZ;
      boat.rotation.y = yaw;

      // Free-orbiting third-person camera: drag still uses yaw/pitch,
      // but now it orbits the boat in full 3D instead of only turning
      // horizontally. Clamped so it can never dip below the water.
      var camDist = 26;
      camera.position.set(
        boatX - forward.x * camDist,
        boat.position.y + 8 - forward.y * camDist,
        boatZ - forward.z * camDist
      );
      var waterFloor = waveHeight(camera.position.x, camera.position.z, t) + 2;
      if (camera.position.y < waterFloor) camera.position.y = waterFloor;
      camera.lookAt(boatX, boat.position.y + 2, boatZ);
    } else {
      // First-person walking: movement is flattened to the horizontal
      // plane (no vertical component from look pitch), and eye height
      // stays fixed rather than following the look direction. Blocked
      // by open water — land only.
      flatForward.set(Math.sin(yaw), 0, Math.cos(yaw));
      flatRight.set(Math.sin(yaw - Math.PI/2), 0, Math.cos(yaw - Math.PI/2));
      var walkDist = moveSpeed * dt * (running ? 2.2 : 1);
      var wx = 0, wz = 0;
      if (keys['KeyW']||keys['ArrowUp'])    { wx += flatForward.x; wz += flatForward.z; }
      if (keys['KeyS']||keys['ArrowDown'])  { wx -= flatForward.x; wz -= flatForward.z; }
      if (keys['KeyD']||keys['ArrowRight']) { wx += flatRight.x;   wz += flatRight.z; }
      if (keys['KeyA']||keys['ArrowLeft'])  { wx -= flatRight.x;   wz -= flatRight.z; }
      var curGroundHere = groundHeightAt(playerX, playerZ);
      var wTryX = playerX + wx * walkDist;
      if (!blockedForWalking(wTryX, playerZ)){
        var gAtX = groundHeightAt(wTryX, playerZ);
        if (!grounded || gAtX <= curGroundHere + STEP_EPS) playerX = wTryX;
      }
      var wTryZ = playerZ + wz * walkDist;
      if (!blockedForWalking(playerX, wTryZ)){
        var gAtZ = groundHeightAt(playerX, wTryZ);
        if (!grounded || gAtZ <= curGroundHere + STEP_EPS) playerZ = wTryZ;
      }

      var groundNow = groundHeightAt(playerX, playerZ);
      if (!grounded){
        verticalVelocity -= GRAVITY * dt;
        playerY += verticalVelocity * dt;
        if (playerY <= groundNow){
          playerY = groundNow;
          verticalVelocity = 0;
          grounded = true;
        }
      } else {
        playerY = groundNow;
      }

      landBean.visible = thirdPerson;
      landBean.position.set(playerX, playerY, playerZ);
      landBean.rotation.y = yaw;

      var eyeY = playerY + EYE_HEIGHT;
      if (thirdPerson){
        var pcamDist = 15;
        camera.position.set(
          playerX - forward.x * pcamDist,
          eyeY + 1 - forward.y * pcamDist * 0.5,
          playerZ - forward.z * pcamDist
        );
        camera.lookAt(playerX, eyeY, playerZ);
      } else {
        camera.position.set(playerX, eyeY, playerZ);
      }
    }

    if (!onBoat && !thirdPerson){
      var lookTarget = camera.position.clone().add(forward);
      camera.lookAt(lookTarget);
    }

    updateOcean(t);
    updateBoat(t);
    renderer.render(scene, camera);
  }
  animate();

  window.addEventListener('resize', function(){
    camera.aspect = window.innerWidth/window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });
})();
</script>
</body>
</html>
